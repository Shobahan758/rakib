; Production upload limits for PHP-FPM / CGI hosting.
; The application accepts hero images up to 4 MB and videos up to 50 MB.
upload_max_filesize = 64M
post_max_size = 128M
max_file_uploads = 100
max_execution_time = 180
max_input_time = 180
memory_limit = 256M
display_errors = Off
log_errors = On
